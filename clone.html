 <style>
    body{
        background: linear-gradient(135deg, #667eea 0%,#764ba2 100%);
        font-family: "Arial",sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .game-box{
        background: rgb(245, 244, 244);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        text-align: center;
        width: 350px;

    }
    h1{
        color: #764ba2;
        margin-bottom: 20px;
        font-size: 28px;
    }
    #guessnumber{
        width: 80%;
        padding: 12px;
        font-size: 18px;
        border: 2px solid #667eea;
        border-radius: 10px;
        outline: none;
        text-align: center;
        margin-bottom: 15px;
    }
    button{
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 18px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        font-weight: bold;
    }
    button:hover{
        background: #764ba2;
        transform: scale(1.05);
    }
    #result{
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
        min-height: 30px;
        color:#333;
    }
    #score{
        font-size: 18px;
        color:#667eea;
        font-weight: bold;
        margin-top: 10px;
    }
 </style>
 
 
 
 
 <div class="game-box">
    <h1>🎯Guess The Number</h1>
<input id="guessnumber" type="number" min="1" max="10" placeholder="Enter 1 to 10">
<br>
<button onclick="check()">Check</button>
<p id="result"> Start Guessing</p>
<p id="score">Score:10</p>
 </div>

<script>

    var guessnumber=document.getElementById("guessnumber");
    var result=document.getElementById("result");
    var score=document.getElementById("score");
    var randomNumber=Math.floor(Math.random()*10)+1;
    var totalscore=10;
    

    score.textContent="score"+totalscore

    function check(){
        var enterednumber=Number(guessnumber.value)

        if(randomNumber==enterednumber){
            result.textContent="Righr !  YOu Won 🎉"
            alert(" Super Jesii You Won 🥰");

            //addded :New game start
            randomNumber=Math.floor(Math.random()*10)+1;
            totalscore=10;
            score.textContent="score:"+totalscore;
            guessnumber.value="";
        }
        else{
            totalscore=totalscore -1;
            score.textContent ="score"+totalscore;

            //Added :Hint system

            if(enterednumber>randomNumber){
                result.textContent="Wrong! Too High ⬇️";
            }else{
                result.textContent="Wrong! Too Low ⬇️";
            }
            //Added :Game over
            if(totalscore<=0){
                alert("Game Over! Correct Number was" + randomNumber);
                totalscore=10;
                randomNumber=Math.floor(Math.random()*10)+1;
                score.textContent="score:" +totalscore;
                result.textContent="New Game Started";
            }
        }
        guessnumber:value="";
    }
</script>
